apiVersion: v1
kind: Service
metadata:
  name: hadoop-namenode
  namespace: hadoop
spec:
  selector:
    app: hadoop
    component: namenode
  ports:
    - name: rpc
      port: 9820
    - name: web
      port: 9870
---
apiVersion: v1
kind: Service
metadata:
  name: hadoop-datanode
  namespace: hadoop
spec:
  selector:
    app: hadoop
    component: datanode
  ports:
    - port: 9866